name: Build Mod
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: geode-sdk/build-geode-mod@main
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: Better-UI-Windows
          path: build/*.geode
